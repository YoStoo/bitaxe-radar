name = "bitaxe-radar-alerts"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# TODO: after the Worker is deployed, set PUBLIC_BASE to its real public URL
# (custom domain recommended, e.g. https://subscribe.bitaxeradar.com) and uncomment [[routes]] below.
[vars]
PUBLIC_BASE = "https://bitaxe-radar-alerts.bitaxeradar.workers.dev"
SITE_URL = "https://bitaxeradar.com"
ASK_DAILY_LIMIT = "200"     # max /ask questions per day (cost safety net)

# Custom domain (bitaxeradar.com must be a zone in the same Cloudflare account; see README).
# [[routes]]
# pattern = "subscribe.bitaxeradar.com"
# custom_domain = true

# Optional light per-IP rate limit (needs Wrangler >= 4.36). The code works without it.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# "Ask Bitaxe Radar" (POST /ask). Daily question cap; storage for the counter is the KV namespace below.
# Create it once with `npx wrangler kv namespace create ASK_KV`, paste the id it prints, then uncomment.
# Without it the Worker still runs, but the cap is only per Worker copy (weaker).
[[kv_namespaces]]
binding = "ASK_KV"
id = "90bdf0c8c48e428e91eb26516536a002"

# Secrets (NOT in this file) -- set with `wrangler secret put <NAME>`:
#   RESEND_API_KEY, SIGNING_SECRET, TURNSTILE_SECRET, ANTHROPIC_API_KEY (for /ask)

# Workers AI: turns guide passages and questions into embeddings for RAG (search_guides, src/rag.js).
# Free daily allowance; our use is tiny (about 100 passages once per guide change + one short question per search).
[ai]
binding = "AI"
