name: collect-and-deploy
on:
  schedule: [{cron: "17 */6 * * *"}]
  push: {branches: [main], paths: ["site/**", "collector/**", "build_site.py", "earnings.py", "templates/**", ".github/workflows/**"]}
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 collector/collect.py
      - run: python3 build_site.py
      - run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data site/data.js
          git diff --cached --quiet || (git commit -m "data: update prices" && git push)
      # Price-drop alert emails. No-op until the RESEND_API_KEY repo secret exists. A failure here never blocks the deploy.
      - name: send-alerts
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          PUBLIC_BASE: ${{ vars.PUBLIC_BASE }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$SIGNING_SECRET" ] || [ -z "$PUBLIC_BASE" ]; then echo "alerts not configured; skipping"; exit 0; fi
          python3 scripts/send_alerts.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
