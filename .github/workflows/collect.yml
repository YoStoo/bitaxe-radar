name: collect-and-deploy
on:
  schedule: [{cron: "17 */6 * * *"}]
  push: {branches: [main], paths: ["site/**", "collector/**", "build_site.py", "newlows.py", "earnings.py", "newsletter.py", "data/newsletter/**", "scripts/indexnow.py", "templates/**", ".github/workflows/**"]}
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    outputs: {indexnow_urls: "${{ steps.inow.outputs.urls }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 collector/collect.py
      # Solo-mined blocks (mempool.space + SoloLuck.io). A failure keeps the last data and never blocks the deploy.
      - run: python3 collector/solo_wins.py
        continue-on-error: true
      - run: curl -sf --max-time 20 https://bitaxeradar.com/sitemap.xml -o /tmp/old_sitemap.xml || true
      - run: python3 build_site.py
      - id: inow
        continue-on-error: true
        run: echo "urls=$(python3 scripts/indexnow.py diff /tmp/old_sitemap.xml site/sitemap.xml)" >> "$GITHUB_OUTPUT"
      - run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data site/data.js
          # Retry with a rebase so a docs/code push made during the run can't fail the deploy.
          git diff --cached --quiet || { git commit -m "data: update prices"; for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 10; done; exit 1; }
      # Price-drop alert emails. No-op until the RESEND_API_KEY repo secret exists. A failure here never blocks the deploy.
      - name: send-alerts
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          PUBLIC_BASE: ${{ vars.PUBLIC_BASE }}
          POSTAL_ADDRESS: ${{ secrets.POSTAL_ADDRESS }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$SIGNING_SECRET" ] || [ -z "$PUBLIC_BASE" ]; then echo "alerts not configured; skipping"; exit 0; fi
          python3 scripts/send_alerts.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  # Ping IndexNow (Bing/Yandex/...) with new or content-changed URLs once they are live. Never fails the run.
  indexnow:
    needs: [collect, deploy]
    if: needs.collect.outputs.indexnow_urls != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - env: {URLS: "${{ needs.collect.outputs.indexnow_urls }}"}
        run: python3 scripts/indexnow.py submit $URLS
