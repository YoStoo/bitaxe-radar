# Live evals for the Deal of the Day agent (evals/deal/, docs/DEAL_AGENT.md). MANUAL ONLY: it calls the real
# Claude API with the ANTHROPIC_API_KEY secret. All 11 cases cost about 1-2 cents; the runner stops at --max-cost.
# Results are committed to evals/results/ in the same format as local runs (<time>-deal-live[-label].json + .md),
# which the eval dashboard reads. No site build, no deploy.
name: deal-evals
on:
  workflow_dispatch:
    inputs:
      only: {description: "Only cases whose id contains these words (comma-separated). Empty = all 11.", required: false, default: ""}
      label: {description: "Label added to the result file name, e.g. prompt-v2", required: false, default: ""}
      max_cost: {description: "Stop when the run has spent this many US dollars", required: false, default: "0.10"}
permissions:
  contents: write
concurrency: {group: deal-evals, cancel-in-progress: false}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Latest main (see collect.yml). It only adds new, uniquely named files under evals/results/, so it can't
      # conflict with the data commits and doesn't need to wait in the "pages" queue.
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run the live deal evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
          LABEL: ${{ inputs.label }}
          MAX_COST: ${{ inputs.max_cost }}
        run: python3 evals/deal/run_deal_evals.py --mode live --only "$ONLY" --label "$LABEL" --max-cost "$MAX_COST"
      - name: Show the score
        if: always()
        run: f=$(ls -t evals/results/*-deal-live*.md 2>/dev/null | head -1); [ -n "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; true
      - name: Commit the results
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add evals/results
          git diff --cached --quiet || { git commit -m "evals: deal agent live run"; for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 10; done; exit 1; }
